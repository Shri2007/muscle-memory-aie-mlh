# learned by Muscle Memory from 5 verified decisions
rules:
- id: mm-swallowed_exception-v1
  languages:
  - python
  severity: WARNING
  message: Catching broad Exception to silently fall back hides real failures.
  pattern-regex: except\s+Exception\s*:\s*\n[ \t]+(?:return\b|\w+\s*=[^=])
  metadata:
    kind: swallowed_exception
    support: 5
    version: 1
    active: true
    verdict: cut
    learned_at: '2026-11-13T23:15:06+00:00'
