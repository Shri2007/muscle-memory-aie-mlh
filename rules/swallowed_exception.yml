rules:
- id: mm-swallowed_exception-v1
  languages:
  - python
  severity: WARNING
  message: Catching Exception just to return or assign a fallback silently hides real bugs.
  pattern-regex: ^\s*except(?:\s+Exception)?\s*:\s+(?:return\b|pass\b|[a-zA-Z_]\w*\s*=)
  metadata:
    kind: swallowed_exception
    support: 5
    version: 1
    active: false
    verdict: cut
    learned_at: '2026-11-13T22:36:21+00:00'
