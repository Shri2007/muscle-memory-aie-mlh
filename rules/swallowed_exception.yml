rules:
- id: mm-swallowed_exception-v1
  languages:
  - python
  severity: WARNING
  message: Silently catching broad exceptions hides bugs instead of letting failures surface.
  pattern-regex: ^\s*except(?:\s+Exception)?:\s+(?:return\b|pass\b|\w+\s*=)
  metadata:
    kind: swallowed_exception
    support: 5
    version: 1
    active: true
    verdict: cut
    learned_at: '2026-11-13T19:57:13+00:00'
