# learned by Muscle Memory from 5 verified decisions
rules:
- id: mm-swallowed_exception-v1
  languages:
  - python
  severity: WARNING
  message: Catching broad exceptions to return or assign a fallback silently hides real failures.
  pattern-regex: ^\s*except(?:\s+Exception)?\s*:\s+(?:return\b|pass\b|[A-Za-z_]\w*\s*=(?!=))
  metadata:
    kind: swallowed_exception
    support: 5
    version: 1
    active: false
    verdict: cut
    learned_at: '2026-11-13T22:34:08+00:00'
