# learned by Muscle Memory from 5 verified decisions
rules:
- id: mm-restating_comment-v1
  languages:
  - python
  severity: WARNING
  message: Narrating what the next line obviously does adds noise without explaining why.
  pattern-regex: ^([ \t]*)#[ \t]+[A-Z][a-z]+(?:[ \t]+\w+){1,5}[ \t]*\r?\n\1[^#\s]
  metadata:
    kind: restating_comment
    support: 5
    version: 1
    active: true
    verdict: cut
    learned_at: '2026-11-13T22:33:42+00:00'
