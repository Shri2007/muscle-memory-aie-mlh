# learned by Muscle Memory from 5 verified decisions
rules:
- id: mm-restating_comment-v1
  languages:
  - python
  severity: WARNING
  message: Restating what the next line does adds noise without explaining why.
  pattern-regex: '^([ \t]*)# [A-Z][a-z]+(?: [A-Za-z]+){1,5}\n\1[a-z]'
  metadata:
    kind: restating_comment
    support: 5
    version: 1
    active: true
    verdict: cut
    learned_at: '2026-11-13T22:35:58+00:00'
