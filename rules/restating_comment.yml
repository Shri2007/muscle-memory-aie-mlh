# learned by Muscle Memory from 5 verified decisions
rules:
- id: mm-restating_comment-v1
  languages:
  - python
  severity: WARNING
  message: Restating what the next line already does adds noise without explaining why.
  pattern-regex: '(?m)^[ \t]*# [A-Z][a-z]+(?: [A-Za-z]+){1,5}[ \t]*\n[ \t]*\S'
  metadata:
    kind: restating_comment
    support: 5
    version: 1
    active: true
    verdict: cut
    learned_at: '2026-11-13T20:28:41+00:00'
