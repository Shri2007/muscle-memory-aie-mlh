rules:
- id: mm-restating_comment-v1
  languages:
  - python
  severity: WARNING
  message: Comments restating what the next line already says add noise without explaining why.
  pattern-regex: '^[ \t]*# [A-Z][a-z]+(?: [a-zA-Z]+){1,5}[ \t]*\r?\n[ \t]*\S'
